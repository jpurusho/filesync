name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-binstall (for faster Tauri CLI install)
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Install Tauri CLI (pre-compiled binary)
        run: cargo binstall tauri-cli --version "^2.0" --no-confirm

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install

      - name: Build release
        run: cargo tauri build

      - name: Create ZIP
        run: |
          cd target/release/bundle/macos
          zip -r FileSync.app.zip FileSync.app
          cd ../../../../
          mv target/release/bundle/macos/FileSync.app.zip .
          ls -lh FileSync.app.zip

      - name: Create latest.json
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "notes": "Update to $VERSION",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/$VERSION/FileSync.app.zip"
              }
            }
          }
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FileSync.app.zip
            latest.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
